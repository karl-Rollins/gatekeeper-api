openapi: 3.0.3
info:
  title: Gatekeeper API
  version: 1.0.0
  description: >
    Event ticketing and booking REST API with atomic transactional seat reservation
    that prevents overselling under concurrent load.
servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      description: Verifies the API process is running and can query PostgreSQL.
      responses:
        '200':
          description: Service and database are healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: connected
        '503':
          description: Database connection check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events:
    post:
      summary: Create a new event
      description: >
        Creates an event with initial seats_remaining equal to capacity.
        If capacity is 0, initial status is sold_out; otherwise on_sale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEvent'
      responses:
        '201':
          description: Event created
          headers:
            Location:
              description: Canonical path of the created event
              schema:
                type: string
                example: /events/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      summary: List events (keyset-paginated)
      parameters:
        - $ref: '#/components/parameters/AfterCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Paginated list of events ordered by id ascending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /events/{id}:
    get:
      summary: Fetch an event by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Event details including seats_remaining
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{id}/bookings:
    post:
      summary: Book tickets for an event
      description: >
        Atomically decrements seats_remaining and inserts a confirmed booking in a single transaction.
        Never oversells under concurrent requests.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBooking'
      responses:
        '201':
          description: Booking confirmed
          headers:
            Location:
              description: Canonical path of the created booking
              schema:
                type: string
                example: /bookings/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid body, malformed id, or unknown customer_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  summary: Invalid quantity or payload
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Invalid request body
                unknownCustomer:
                  summary: Referenced customer does not exist
                  value:
                    error:
                      code: FOREIGN_KEY_VIOLATION
                      message: Referenced resource does not exist
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Booking conflict (sold out, not enough seats, or cancelled event)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                soldOut:
                  summary: Event has 0 seats remaining
                  value:
                    error:
                      code: EVENT_SOLD_OUT
                      message: Event 3 is sold out
                insufficientSeats:
                  summary: Requested quantity exceeds remaining seats
                  value:
                    error:
                      code: INSUFFICIENT_SEATS
                      message: Only 2 seat(s) remaining for event 2; requested 4
                eventCancelled:
                  summary: Event is cancelled
                  value:
                    error:
                      code: EVENT_CANCELLED
                      message: Event 4 is cancelled and cannot accept bookings

    get:
      summary: List bookings for an event (keyset-paginated)
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/AfterCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Paginated list of confirmed and cancelled bookings for the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{id}:
    get:
      summary: Fetch a booking by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{id}/cancel:
    post:
      summary: Cancel a confirmed booking
      description: >
        Marks a confirmed booking as cancelled and restores its quantity to the event's seats_remaining.
        If the event was sold_out, its status flips back to on_sale.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Booking cancelled and seats restored
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Booking was already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BOOKING_ALREADY_CANCELLED
                  message: Booking 1 is already cancelled

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Positive integer resource ID
    AfterCursor:
      name: after
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Keyset cursor (last seen ID)
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of items to return (1..100)

  responses:
    BadRequest:
      description: Invalid input parameters or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    NewEvent:
      type: object
      additionalProperties: false
      required: [name, venue, starts_at, capacity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: Backend Systems Summit
        venue:
          type: string
          minLength: 1
          maxLength: 150
          example: Civic Hall
        starts_at:
          type: string
          format: date-time
          example: '2027-02-15T09:00:00Z'
        capacity:
          type: integer
          minimum: 0
          maximum: 100000
          example: 100

    Event:
      type: object
      required: [id, name, venue, starts_at, capacity, seats_remaining, status, created_at]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Backend Systems Summit
        venue:
          type: string
          example: Civic Hall
        starts_at:
          type: string
          format: date-time
        capacity:
          type: integer
          example: 100
        seats_remaining:
          type: integer
          example: 96
        status:
          type: string
          enum: [on_sale, sold_out, cancelled]
          example: on_sale
        created_at:
          type: string
          format: date-time

    NewBooking:
      type: object
      additionalProperties: false
      required: [customer_id, quantity]
      properties:
        customer_id:
          type: integer
          minimum: 1
          example: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          example: 2

    Booking:
      type: object
      required: [id, event_id, customer_id, quantity, status, booked_at]
      properties:
        id:
          type: integer
          example: 1
        event_id:
          type: integer
          example: 1
        customer_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
        status:
          type: string
          enum: [confirmed, cancelled]
          example: confirmed
        booked_at:
          type: string
          format: date-time

    EventListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          type: integer
          nullable: true
          example: 20

    BookingListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        next_cursor:
          type: integer
          nullable: true
          example: null

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid request body
            details:
              type: array
              items:
                type: object